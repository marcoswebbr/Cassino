<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Administrador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0e0e0e;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2, h3 {
      text-align: center;
    }
    .box {
      background: #1b1b1b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
    }
    button {
      background: #00c853;
      font-weight: bold;
      cursor: pointer;
    }
    .danger {
      background: #b00020;
      margin-top: 5px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }
    .jogo {
      border: 1px solid #333;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<h2>🔐 Painel Administrador</h2>

<div id="login" class="box">
  <input type="password" id="senha" placeholder="Senha do administrador">
  <button onclick="login()">Entrar</button>
</div>

<div id="painel" style="display:none">

  <div class="box">
    <h3>⚙️ Controle de RTP</h3>
    <label>
      <input type="checkbox" id="rtpAuto">
      RTP automático (a cada 3 minutos)
    </label>
    <button onclick="salvarConfig()">Salvar Configuração</button>
  </div>

  <div class="box">
    <h3>➕ Adicionar Jogo</h3>

    <input id="nome" placeholder="Nome do jogo">
    <input id="provedor" placeholder="Provedor (PG, PP, WG)">
    <input type="file" id="imagem" accept="image/*" onchange="previewImagem()">
    <img id="preview" style="display:none">
    <input id="link" placeholder="Link do cassino / afiliado">

    <button onclick="salvarJogo()">Salvar Jogo</button>
  </div>

  <div class="box">
    <h3>📋 Jogos Cadastrados</h3>
    <div id="listaJogos"></div>
  </div>

</div>

<script src="js/admin.js"></script>
</body>
</html>
